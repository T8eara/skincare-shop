services:
    app:
        build: .
        container_name: skincare_app
        ports:
            - "8000:8000"
        volumes:
            - .:/var/www/html
        depends_on:
            - mysql

    mysql:
        image: mysql:8
        container_name: skincare_mysql
        restart: always
        environment:
            MYSQL_DATABASE: skincare_db
            MYSQL_ROOT_PASSWORD: root123
            MYSQL_ROOT_HOST: "%"
        ports:
            - "3307:3306"
